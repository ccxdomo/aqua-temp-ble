probe_registers:
  name: Probe registers
  description: >-
    Read a raw register block from the heat pump over BLE and log every
    register (raw value, hex, /10) for label-to-register calibration.
    Close the vendor app first: the unit accepts a single Bluetooth
    connection. The log lines appear in home-assistant.log and, when the
    service is called with a response, are also returned as JSON.
  fields:
    device_id:
      name: Device
      description: >-
        Device to probe. Leave empty to probe every configured Aqua Temp unit.
      required: false
      selector:
        device:
          integration: aqua_temp_ble
    block:
      name: Block
      description: Register block to read. High blocks are experimental.
      required: false
      default: base
      selector:
        select:
          mode: dropdown
          options:
            - label: "Base block (registers 7-51)"
              value: base
            - label: "High block 1001-1045"
              value: "1001"
            - label: "High block 1046-1090"
              value: "1046"
            - label: "High block 1091-1135"
              value: "1091"
            - label: "High block 1136-1180"
              value: "1136"
            - label: "High block 2001-2045"
              value: "2001"
            - label: "High block 2046-2090"
              value: "2046"
power_write_probe:
  name: Power write probe
  description: >-
    Run the power-write proof probe (spec 016): sends the vendor's own
    power-ON frame, verifies the pushed mirror register 2011 follows it,
    then sends the power-OFF frame and verifies the revert. One WARNING
    verdict line is logged with the outcome. The unit must be OFF and the
    vendor app must be closed (the unit accepts a single Bluetooth
    connection). This is a diagnostic measurement, not a control surface:
    it always returns the unit to OFF when it can, and the verdict line
    tells you when it could not.
  fields:
    device_id:
      name: Device
      description: >-
        Device to probe. Leave empty to probe every configured Aqua Temp unit.
      required: false
      selector:
        device:
          integration: aqua_temp_ble
setpoint_write_probe:
  name: Setpoint write probe
  description: >-
    Run the two-phase setpoint proof probe (spec 019). Phase A writes the
    register's OWN current value back (a true no-op: the register receives
    exactly what it already holds, nothing can change) and verifies no
    other register of the block moved. Phase B dips the heat setpoint by
    0.5 °C, verifies the pushed mirror register 1046 follows, then reverts
    it and verifies again. The physical effect: the pool's heat target dips
    half a degree for about 2 minutes, then returns. The unit can be ON or
    OFF, and the vendor app must be closed (the unit accepts a single
    Bluetooth connection). One WARNING verdict line is logged with the
    outcome; an EXECUTED + REVERSIBLE verdict is the evidence required to
    enable the setpoint control option. Diagnostic measurement, not a
    control surface: a failed revert is never silent — the verdict line
    tells you the new setpoint and how to restore it from the panel.
  fields:
    device_id:
      name: Device
      description: >-
        Device to probe. Leave empty to probe every configured Aqua Temp unit.
      required: false
      selector:
        device:
          integration: aqua_temp_ble
