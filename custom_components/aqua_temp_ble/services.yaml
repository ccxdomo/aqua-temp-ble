probe_registers:
  name: Probe registers
  description: >-
    Read a raw register block from the heat pump over BLE and log every
    register (raw value, hex, /10) for label-to-register calibration.
    Close the vendor app first: the unit accepts a single Bluetooth
    connection. The log lines appear in home-assistant.log and, when the
    service is called with a response, are also returned as JSON.
  fields:
    device_id:
      name: Device
      description: >-
        Device to probe. Leave empty to probe every configured Aqua Temp unit.
      required: false
      selector:
        device:
          integration: aqua_temp_ble
    block:
      name: Block
      description: Register block to read. High blocks are experimental.
      required: false
      default: base
      selector:
        select:
          mode: dropdown
          options:
            - label: "Base block (registers 7-51)"
              value: base
            - label: "High block 1001-1045"
              value: "1001"
            - label: "High block 1046-1090"
              value: "1046"
            - label: "High block 1091-1135"
              value: "1091"
            - label: "High block 1136-1180"
              value: "1136"
            - label: "High block 2001-2045"
              value: "2001"
            - label: "High block 2046-2090"
              value: "2046"